sonar.projectName=Gym Management System
sonar.sourceEncoding=UTF-8

sonar.projectKey=lethanhan01_gym-management-system-01
sonar.organization=lethanhan01

sonar.sources=client/src,server/src,server/prisma
sonar.tests=server/src,client/src
sonar.test.inclusions=server/src/**/*.spec.ts,client/src/**/*.test.ts,client/src/**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.next/**,server/src/**/*.spec.ts,client/src/**/*.test.ts,client/src/**/*.test.tsx,client/src/styles/generated.css,client/src/vite-env.d.ts
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/*.d.ts,client/src/styles/generated.css
# Exclude non-product or declarative files from copy/paste detection only. These
# patterns intentionally keep application pages, components, services, DTOs,
# shared helpers, hand-written styles, and static mappings in the CPD scope.
sonar.cpd.exclusions=server/prisma/seed.ts,server/prisma/seed/**,server/prisma/schema.prisma,server/prisma/schema/**,server/prisma/migrations/**,client/src/locales/**,client/src/test/**,client/src/**/*.test.ts,client/src/**/*.test.tsx,**/*.d.ts

sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
sonar.typescript.tsconfigPaths=client/tsconfig.json,server/tsconfig.json,server/prisma/tsconfig.json
sonar.qualitygate.wait=true
